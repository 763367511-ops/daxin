<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大新 英语单词朗读</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f4f8; min-height: 100vh; }
  header { background: linear-gradient(135deg, #276749, #48bb78); color: white; padding: 18px 16px 12px; text-align: center; }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
  .search-wrap { background: white; padding: 10px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .search-wrap input { width: 100%; padding: 8px 14px; border: 1.5px solid #cbd5e0; border-radius: 20px; font-size: 0.95rem; outline: none; }
  .search-wrap input:focus { border-color: #276749; }
  .sticky-panel { position: sticky; top: 0; z-index: 100; background: white; box-shadow: 0 2px 12px rgba(0,0,0,.12); padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .panel-icon { font-size: 2.2rem; min-width: 48px; text-align: center; }
  .panel-info { flex: 1; min-width: 0; }
  .panel-word { font-size: 1.6rem; font-weight: 700; color: #1a202c; line-height: 1.1; }
  .panel-phonetic { font-size: 0.85rem; color: #718096; margin-top: 2px; }
  .panel-pos { display: inline-block; font-size: 0.72rem; background: #e6f4ed; color: #276749; border-radius: 4px; padding: 1px 6px; margin-top: 3px; }
  .panel-meaning { font-size: 1rem; color: #2d3748; margin-top: 4px; font-weight: 600; }
  .panel-btns { display: flex; gap: 8px; align-items: center; }
  .btn-speak { background: #276749; color: white; border: none; border-radius: 20px; padding: 8px 18px; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .2s; }
  .btn-speak:hover { background: #1e4d34; }
  .btn-slow { background: #e2e8f0; color: #2d3748; border: none; border-radius: 20px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer; transition: background .2s; }
  .btn-slow:hover { background: #cbd5e0; }
  .tabs-wrap { display: flex; overflow-x: auto; background: white; padding: 0 12px; border-bottom: 2px solid #e2e8f0; gap: 4px; }
  .tabs-wrap::-webkit-scrollbar { height: 0; }
  .tab-btn { flex-shrink: 0; padding: 10px 16px; border: none; background: none; font-size: 0.85rem; font-weight: 600; color: #718096; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s; white-space: nowrap; }
  .tab-btn.active { color: #276749; border-bottom-color: #276749; }
  .content { padding: 14px; }
  .unit-section { display: none; }
  .unit-section.active { display: block; }
  .unit-header { font-size: 0.8rem; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; padding: 4px 8px; background: #f7fafc; border-radius: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .card { background: white; border-radius: 14px; padding: 14px 10px; text-align: center; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,.07); transition: transform .15s, box-shadow .15s; border: 2px solid transparent; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .card.selected { border-color: #276749; background: #e6f4ed; }
  .card-emoji { font-size: 1.8rem; display: block; margin-bottom: 6px; }
  .card-word { font-size: 0.95rem; font-weight: 700; color: #1a202c; }
  .card-cn { font-size: 0.8rem; color: #4a5568; margin-top: 4px; }
  .anim-bounce { animation: bounce 1s infinite; }
  .anim-spin { animation: spin 1s linear infinite; }
  .anim-pulse { animation: pulse 1s infinite; }
  .anim-float { animation: float 2s ease-in-out infinite; }
  .anim-shake { animation: shake 0.5s infinite; }
  .anim-wave { animation: wave 1s ease-in-out infinite; }
  .anim-swing { animation: swing 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  @keyframes wave { 0%,100%{transform:rotate(0deg)} 33%{transform:rotate(-10deg)} 66%{transform:rotate(10deg)} }
  @keyframes swing { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(15deg)} }
  @media(max-width:480px){ .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));} .panel-word{font-size:1.3rem;} }
</style>
</head>
<body>
<header>
  <h1>大新 英语单词朗读</h1>
  <p>曹馨月老师 · 点击朗读 · 慢速练习</p>
</header>
<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="🔍 搜索单词或中文..." oninput="filterWords()">
</div>
<div class="sticky-panel" id="stickyPanel">
  <div class="panel-icon" id="panelIcon">👆</div>
  <div class="panel-info">
    <div class="panel-word" id="panelWord">点击单词卡片</div>
    <div class="panel-phonetic" id="panelPhonetic">开始朗读练习</div>
    <div style="margin-top:4px"><span class="panel-pos" id="panelPos"></span></div>
    <div class="panel-meaning" id="panelMeaning">选择任意单词</div>
  </div>
  <div class="panel-btns">
    <button class="btn-speak" id="btnSpeak" onclick="speakCurrent(1)">🔊 朗读</button>
    <button class="btn-slow" id="btnSlow" onclick="speakCurrent(0.5)">🐢 慢读</button>
  </div>
</div>
<div class="tabs-wrap" id="tabsWrap"></div>
<div class="content" id="content"></div>

<script>
const TABS = [
  { id:"u1", label:"Unit 1-2 运动", color:"#2B6CB0", bg:"#ebf4ff", words:[
    {w:"sport",cn:"运动",e:"🏅"},{w:"jump",cn:"跳",e:"🦘"},{w:"high",cn:"高的",e:"⬆️"},{w:"because",cn:"因为",e:"💡"},
    {w:"hope",cn:"希望",e:"🌟"},{w:"phone",cn:"电话",e:"📱"},{w:"wash",cn:"洗",e:"🚿"},{w:"dish",cn:"碗",e:"🍽️"},
    {w:"chore",cn:"家务",e:"🧹"},{w:"Mr",cn:"先生",e:"👨"},{w:"may",cn:"可以",e:"✅"},{w:"outside",cn:"在室外",e:"🌳"},
    {w:"tidy",cn:"整理",e:"🧹"},{w:"easy",cn:"容易的",e:"😌"},{w:"helpful",cn:"乐于助人的",e:"🤲"},{w:"warm",cn:"温暖的",e:"🌡️"},
    {w:"house",cn:"房子",e:"🏠"},{w:"water",cn:"浇水",e:"💧"},{w:"yard",cn:"庭院",e:"🌿"},{w:"helper",cn:"帮手",e:"🤝"}
  ]},
  { id:"u2", label:"Unit 3-4 天气", color:"#276749", bg:"#e6f4ed", words:[
    {w:"weather",cn:"天气",e:"🌤️"},{w:"sunny",cn:"晴朗的",e:"☀️"},{w:"cloud",cn:"云",e:"☁️"},{w:"rainy",cn:"下雨的",e:"🌧️"},
    {w:"snow",cn:"雪",e:"❄️"},{w:"any",cn:"任何",e:"🔄"},{w:"wonderful",cn:"令人惊叹的",e:"✨"},{w:"season",cn:"季节",e:"🌿"},
    {w:"spring",cn:"春天",e:"🌸"}
  ]},
  { id:"u3", label:"Unit 5-6 交通", color:"#C05621", bg:"#fdf0e6", words:[
    {w:"ship",cn:"大船",e:"⛵"},{w:"plane",cn:"飞机",e:"✈️"},{w:"subway",cn:"地铁",e:"🚇"},{w:"bus",cn:"公共汽车",e:"🚌"},
    {w:"wheel",cn:"车轮",e:"⚙️"},{w:"left",cn:"向左",e:"⬅️"},{w:"library",cn:"图书馆",e:"📚"},{w:"on one's own",cn:"独立地",e:"🙋"},
    {w:"be careful",cn:"小心",e:"⚠️"}
  ]},
  { id:"u4", label:"Unit 7-8", color:"#6B46C1", bg:"#f0ebfa", words:[
    {w:"to-do list",cn:"待办清单",e:"📋"},{w:"Saturday",cn:"星期六",e:"📅"},{w:"Sunday",cn:"星期日",e:"📅"},{w:"homework",cn:"作业",e:"📝"},
    {w:"weekend",cn:"周末",e:"🎉"},{w:"get up",cn:"起床",e:"⏰"},{w:"go to bed",cn:"去睡觉",e:"🛏️"},{w:"hurry up",cn:"快点",e:"⚡"},
    {w:"wake up",cn:"醒来",e:"⏰"},{w:"late",cn:"迟到的",e:"⏰"},{w:"go out to play",cn:"出去玩",e:"🎮"}
  ]}
];
const ANIMS = ["anim-bounce","anim-spin","anim-pulse","anim-float","anim-shake","anim-wave","anim-swing"];
let currentWord = null, currentTab = 0;

function init() {
  const tabsWrap = document.getElementById("tabsWrap");
  const content = document.getElementById("content");
  TABS.forEach((tab, i) => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i===0?" active":"");
    btn.textContent = tab.label;
    btn.onclick = () => switchTab(i);
    tabsWrap.appendChild(btn);
    const sec = document.createElement("div");
    sec.className = "unit-section" + (i===0?" active":"");
    sec.id = "sec-"+i;
    sec.innerHTML = `<div class="unit-header">${tab.label}</div><div class="grid" id="grid-${i}"></div>`;
    content.appendChild(sec);
    renderGrid(i, tab.words);
  });
}

function renderGrid(tabIdx, words) {
  const grid = document.getElementById("grid-"+tabIdx);
  grid.innerHTML = "";
  const tab = TABS[tabIdx];
  words.forEach((item, wi) => {
    const anim = ANIMS[wi % ANIMS.length];
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.word = item.w; card.dataset.cn = item.cn;
    card.innerHTML = `<span class="card-emoji">${item.e}</span>
      <div class="card-word">${item.w}</div>
      <div class="card-cn">${item.cn}</div>`;
    card.onclick = () => selectWord(card, item, tabIdx, wi, anim, tab.color, tab.bg);
    grid.appendChild(card);
  });
}

function switchTab(i) {
  currentTab = i;
  document.querySelectorAll(".tab-btn").forEach((b,idx) => b.classList.toggle("active", idx===i));
  document.querySelectorAll(".unit-section").forEach((s,idx) => s.classList.toggle("active", idx===i));
}

function selectWord(card, item, tabIdx, wi, anim, color, bg) {
  document.querySelectorAll(".card").forEach(c => { c.classList.remove("selected"); c.style.borderColor="transparent"; c.style.background="white"; });
  card.classList.add("selected");
  card.style.borderColor = color;
  card.style.background = bg;
  currentWord = item.w;
  document.getElementById("panelWord").textContent = item.w;
  document.getElementById("panelPhonetic").textContent = "";
  document.getElementById("panelPos").textContent = "";
  document.getElementById("panelMeaning").textContent = item.cn;
  const icon = document.getElementById("panelIcon");
  icon.textContent = item.e;
  icon.className = "panel-icon " + anim;
  document.getElementById("stickyPanel").style.borderLeft = "4px solid " + color;
  speakWord(item.w, 1);
}

function speakWord(word, rate) {
  const audio = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=1`);
  audio.play().catch(() => {
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = "en-US"; utter.rate = rate;
    speechSynthesis.speak(utter);
  });
}

function speakCurrent(rate) {
  if (!currentWord) return;
  if (rate < 1) {
    const utter = new SpeechSynthesisUtterance(currentWord);
    utter.lang = "en-US"; utter.rate = rate;
    speechSynthesis.speak(utter);
  } else {
    speakWord(currentWord, rate);
  }
}

function filterWords() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!q) {
    TABS.forEach((_,i) => renderGrid(i, TABS[i].words));
    return;
  }
  TABS.forEach((tab, i) => {
    const filtered = tab.words.filter(w => w.w.toLowerCase().includes(q) || w.cn.includes(q));
    renderGrid(i, filtered);
    if (filtered.length > 0) switchTab(i);
  });
}

init();
</script>
</body>
</html>
